name: Rebuild knowledge index

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-index-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate and commit index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
            npm run index
            git add -A index index.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Refresh knowledge index'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
          done
          exit 1
